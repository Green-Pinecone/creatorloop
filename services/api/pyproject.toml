[project]
name = "creatorloop-api"
version = "0.1.0"
description = "CreatorLoop backend: Postgres, chain indexer, TigerGraph trust engine, Dodo payments, AI agents, reward epochs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "dodopayments>=1.125.0",
    "eth-abi>=6.0.0",
    "eth-utils>=6.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "networkx>=3.4",
    "openai>=3.41.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pytigergraph>=2.0.5",
    "sqlalchemy[asyncio]>=2.1.6",
    "standardwebhooks>=1.1.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
    "web3>=8.0.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real external services (TigerGraph, Dodo, viaSocket, AI); run manually"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501"]
